<svg width="512" height="512" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hzGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC468" />
      <stop offset="25%" stop-color="#DF9F28" />
      <stop offset="50%" stop-color="#FFEA9F" />
      <stop offset="75%" stop-color="#CA8B1A" />
      <stop offset="100%" stop-color="#96610E" />
    </linearGradient>
    <linearGradient id="hzGoldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#E5A62D" />
      <stop offset="100%" stop-color="#8C5708" />
    </linearGradient>
    <linearGradient id="hzGoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4881E" />
      <stop offset="100%" stop-color="#693F05" />
    </linearGradient>
    <linearGradient id="hzGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A62C" />
      <stop offset="40%" stop-color="#FFF3B8" />
      <stop offset="70%" stop-color="#C3851B" />
      <stop offset="100%" stop-color="#7E4D06" />
    </linearGradient>
  </defs>

  <!-- Outer Orbital Rings -->
  <path d="M 45,95 A 62,62 0 1,1 155,95" stroke="url(#hzGoldRing)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95" />
  <path d="M 38,102 A 70,70 0 1,1 162,102" stroke="url(#hzGoldRing)" stroke-width="1.75" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- 4 Ascending 3D Metallic Skyscraper Towers -->
  <polygon points="62,130 62,75 73,68 73,130" fill="url(#hzGoldShadow)" />
  <polygon points="68,130 68,71 73,68 73,130" fill="url(#hzGoldHighlight)" opacity="0.85" />

  <polygon points="76,130 76,42 88,34 88,130" fill="url(#hzGoldPrimary)" />
  <polygon points="82,130 82,38 88,34 88,130" fill="url(#hzGoldHighlight)" opacity="0.9" />

  <polygon points="91,130 91,12 103,20 103,130" fill="url(#hzGoldPrimary)" />
  <polygon points="97,130 97,16 103,20 103,130" fill="url(#hzGoldShadow)" opacity="0.8" />
  <polygon points="91,12 103,20 97,25 91,12" fill="#FFE899" opacity="0.95" />

  <polygon points="106,130 106,62 117,68 117,130" fill="url(#hzGoldPrimary)" />
  <polygon points="112,130 112,65 117,68 117,130" fill="url(#hzGoldShadow)" opacity="0.9" />

  <!-- Sweeping Black Roof Gable -->
  <path d="M 22,142 C 60,138 85,116 100,102 C 115,116 140,138 178,142 C 142,132 115,110 100,96 C 85,110 58,132 22,142 Z" fill="#0F172A" />

  <!-- 4-Pane Gold Window Grid -->
  <rect x="94" y="112" width="5" height="5" rx="0.5" fill="url(#hzGoldPrimary)" />
  <rect x="101" y="112" width="5" height="5" rx="0.5" fill="url(#hzGoldHighlight)" />
  <rect x="94" y="119" width="5" height="5" rx="0.5" fill="url(#hzGoldShadow)" />
  <rect x="101" y="119" width="5" height="5" rx="0.5" fill="url(#hzGoldPrimary)" />
</svg>
